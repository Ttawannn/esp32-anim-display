; Display Editor firmware — phase 0 (hardware bring-up + benchmarks)
;
; Build:   pio run -e c3_supermini        (or -e c6_supermini, -e esp32_devkit)
; Flash:   pio run -e c3_supermini -t upload
; Monitor: pio device monitor

[platformio]
default_envs = c3_supermini, c6_supermini, esp32_devkit

[env]
; pioarduino = Arduino core 3.x (ESP-IDF 5.x). The official espressif32 platform has no C6 Arduino support.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_upload.flash_size = 4MB
board_upload.maximum_size = 1835008  ; app0 size in partitions/4mb_storage.csv
board_build.flash_mode = dio
board_build.partitions = partitions/4mb_storage.csv
board_build.filesystem = littlefs
lib_deps =
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1
    bitbank2/JPEGDEC@1.8.4
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=1
; C3/C6: Serial is the chip's own USB (USB-Serial-JTAG), no USB-UART chip on the board.
custom_usb_cdc_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3_supermini]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} ${env.custom_usb_cdc_flags} -DBOARD_C3_SUPERMINI

[env:c6_supermini]
board = esp32-c6-devkitc-1
build_flags = ${env.build_flags} ${env.custom_usb_cdc_flags} -DBOARD_C6_SUPERMINI

; ESP32 (WROOM-32) DevKit, 30 pins: Serial is UART0 through the CP2102 / CH340 USB-UART chip.
[env:esp32_devkit]
board = esp32dev
build_flags = ${env.build_flags} -DBOARD_ESP32_DEVKIT
