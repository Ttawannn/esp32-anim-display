; Display Editor firmware — phase 0 (hardware bring-up + benchmarks)
;
; Build:   pio run -e c3_supermini        (or -e c6_supermini)
; Flash:   pio run -e c3_supermini -t upload
; Monitor: pio device monitor

[platformio]
default_envs = c3_supermini, c6_supermini

[env]
; pioarduino = Arduino core 3.x (ESP-IDF 5.x). The official espressif32 platform has no C6 Arduino support.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_upload.flash_size = 4MB
board_upload.maximum_size = 1835008  ; app0 size in partitions/4mb_storage.csv
board_build.flash_mode = dio
board_build.partitions = partitions/4mb_storage.csv
board_build.filesystem = littlefs
lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    bitbank2/JPEGDEC
    bblanchon/ArduinoJson@^7
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

[env:c3_supermini]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DBOARD_C3_SUPERMINI

[env:c6_supermini]
board = esp32-c6-devkitc-1
build_flags = ${env.build_flags} -DBOARD_C6_SUPERMINI
